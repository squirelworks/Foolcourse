[project]
name = "foolcourse"
version = "1.0.1r2"
description = "Course catalog that opens books in Foolbook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "foolbook @ git+https://github.com/squirelworks/Foolbook.git@133901702e59be1543e81f04a27bbf8a9ed0fb4f",
]

[project.urls]
Repository = "https://github.com/squirelworks/Foolcourse"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foolcourse*"]

[tool.setuptools.package-data]
foolcourse = ["_courses/**/*"]
